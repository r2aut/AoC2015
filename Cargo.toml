[package]
name = "aoc2015"
version = "0.1.0"
edition = "2024"
description = "Advent of Code 2015"
readme = "README.md"
license = "Unlicense"
keywords = ["AoC", "AoC2015"]

[dependencies]
anyhow = "1.0.104"
colored = "3.0.0"
itertools = "0.14.0"
md5 = "0.8.0"
rand = "0.10.2"
regex = "1.12.2"
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.clippy]
unwrap_used = "warn" # Запретить unwrap
#expect_used = "warn" # Запретить expect
